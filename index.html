<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Enviar USDT Flash</title>
  <script src="https://cdn.jsdelivr.net/npm/web3@1.10.0/dist/web3.min.js"></script>
</head>
<body style="font-family: sans-serif; text-align: center; padding: 50px; background: #f4f4f4;">

  <h1>USDT Flash</h1>
  <p>Adicione o token e envie o valor que quiser para qualquer carteira.</p>

  <button onclick="addToken()" style="padding: 10px 20px; font-size: 16px;">➕ Adicionar Token à MetaMask</button>
  <br><br>

  <label for="destino">Carteira de destino:</label>
  <input type="text" id="destino" placeholder="0x..." style="width: 400px; padding: 8px; font-size: 16px;">
  <br><br>
  <label for="valor">Valor a enviar (ex: 100):</label>
  <input type="number" id="valor" placeholder="100" style="width: 200px; padding: 8px; font-size: 16px;">
  <br><br>

  <button onclick="enviarToken()" style="padding: 10px 20px; font-size: 16px; background: green; color: white;">
    🚀 Enviar USDTF
  </button>

  <script>
    const tokenAddress = "0xfBeeC1A2789B16DCD30A8d8740dEAed01a8c5fE8";
    const tokenSymbol = "USDT";
    const tokenDecimals = 6;
    const tokenImage = "https://cryptologos.cc/logos/tether-usdt-logo.png";

    async function addToken() {
      try {
        const wasAdded = await window.ethereum.request({
          method: 'wallet_watchAsset',
          params: {
            type: 'ERC20',
            options: {
              address: tokenAddress,
              symbol: tokenSymbol,
              decimals: tokenDecimals,
              image: tokenImage,
            },
          },
        });

        if (wasAdded) {
          alert("Token adicionado com sucesso!");
        } else {
          alert("Token não foi adicionado.");
        }
      } catch (error) {
        console.error(error);
        alert("Erro ao adicionar o token.");
      }
    }

    async function enviarToken() {
      const destino = document.getElementById("destino").value.trim();
      const valor = document.getElementById("valor").value.trim();

      if (!window.ethereum || !destino || !valor) {
        alert("Preencha todos os campos corretamente.");
        return;
      }

      const web3 = new Web3(window.ethereum);
      await window.ethereum.enable();
      const accounts = await web3.eth.getAccounts();
      const from = accounts[0];

      const abi = [
        {
          constant: false,
          inputs: [
            { name: "_to", type: "address" },
            { name: "_value", type: "uint256" }
          ],
          name: "transfer",
          outputs: [{ name: "", type: "bool" }],
          type: "function"
        }
      ];

      const contract = new web3.eth.Contract(abi, tokenAddress);
      const amount = web3.utils.toBN((parseFloat(valor) * 10 ** tokenDecimals).toString());

      try {
        const tx = await contract.methods.transfer(destino, amount).send({ from });
        alert("Transferência realizada! Hash: " + tx.transactionHash);
      } catch (err) {
        console.error(err);
        alert("Erro ao enviar token.");
      }
    }
  </script>
</body>
</html>
